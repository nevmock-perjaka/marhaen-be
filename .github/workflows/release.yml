name: Deploy API Production Build

on:
  push:
    branches: [main, dev, DEV_Azrian]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Transfer Compose File to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: ${{ vars.SSH_PATH }}

      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}
          DOMAIN: ${{ vars.DOMAIN }}
          PORT: ${{ vars.PORT || 3000 }}
          REPLICAS: ${{ vars.REPLICAS || 1 }}
          APP_NAME: ${{ github.event.repository.name }}
          APP_REVISION: ${{ github.sha }}
          APP_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FE_URL: ${{ vars.FE_URL }}
          BE_URL: ${{ vars.BE_URL }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
          MIDTRANS_CLIENT_KEY: ${{ secrets.MIDTRANS_CLIENT_KEY }}
          PAYMENT_GATEWAY_ENABLED: ${{ vars.PAYMENT_GATEWAY_ENABLED }}
          QRIS_MITRA_URL: ${{ vars.QRIS_MITRA_URL }}

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: >-
            IMAGE_TAG, 
            PORT,
            REPLICAS,
            DOMAIN,
            APP_NAME,
            APP_REVISION,
            APP_ENV,
            DATABASE_URL,
            FE_URL,
            BE_URL,
            EMAIL_USERNAME,
            EMAIL_PASSWORD,
            JWT_SECRET,
            MIDTRANS_SERVER_KEY,
            MIDTRANS_CLIENT_KEY,
            PAYMENT_GATEWAY_ENABLED,
            QRIS_MITRA_URL,
            GITHUB_TOKEN,
            GITHUB_REPOSITORY
          script: |
            cd ${{ vars.SSH_PATH }}
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose pull
            docker compose up -d --remove-orphans
            docker compose exec -T marhaen-be npx prisma migrate deploy
            docker image prune -f
